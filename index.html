<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMC 8 2026 — Learn by Playing</title>
<meta name="description" content="Interactive, animated, first-principles solutions to all 25 problems of the 2026 AMC 8, made for young learners.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#2B2340; --soft:#6B6385; --line:#EADFCB;
  --blue:#3B82F6; --blue-l:#DBEAFE; --orange:#F59E0B; --orange-l:#FEF3C7;
  --green:#16A34A; --green-l:#DCFCE7; --red:#E11D48; --red-l:#FFE4E6;
  --purple:#8B5CF6; --purple-l:#EDE9FE; --pink:#EC4899; --pink-l:#FCE7F3;
  --gold:#EAB308; --silver:#94A3B8; --gray:#9CA3AF;
  --r:18px; --shadow:0 4px 0 #EADFCB;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--line);position:sticky;top:0;z-index:20}
header.top .logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0}
header.top .logo .badge{background:var(--blue);color:#fff;border-radius:10px;padding:2px 8px;font-size:15px}
header.top .sp{flex:1}
.stars-total{font-weight:800;background:var(--orange-l);border-radius:999px;padding:4px 12px;white-space:nowrap}

/* home */
.hero{text-align:center;padding:18px 8px 4px}
.hero h1{font-size:30px;margin:6px 0;font-weight:900;line-height:1.15}
.hero p{color:var(--soft);margin:6px auto 0;max-width:560px}
.how{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.how div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{display:flex;flex-direction:column;justify-content:flex-start;background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;box-shadow:var(--shadow);transition:transform .15s;position:relative;min-height:112px}
.tile:hover{transform:translateY(-3px)}
.tile .num{font-weight:900;font-size:26px;line-height:1}
.tile .ico{font-size:28px;position:absolute;right:10px;top:8px}
.tile .tt{font-weight:800;margin-top:6px;font-size:16px;line-height:1.2}
.tile .tp{font-size:13px;color:var(--soft);margin-top:2px}
.tile.done{border-color:var(--green);background:var(--green-l)}
.tile.done::after{content:"★";position:absolute;right:10px;bottom:6px;color:var(--orange);font-size:22px}
.band{margin:22px 0 4px;font-weight:900;font-size:15px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}

/* problem page */
.pnav{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.pnav .pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
.pnav .pill:disabled{opacity:.35;cursor:default}
.pnav .sp{flex:1}
.ptitle{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.ptitle .big{background:var(--blue);color:#fff;font-weight:900;border-radius:14px;padding:6px 12px;font-size:22px}
.ptitle h2{margin:0;font-size:24px;line-height:1.15}
.ptitle .topic{font-size:14px;color:var(--soft);font-weight:700}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.card h3 .chip{font-size:13px;background:var(--purple-l);color:var(--purple);border-radius:999px;padding:2px 10px;font-weight:800}
.q{font-size:19px}
.q b{color:var(--blue)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choice{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;min-width:64px}
.choice .L{color:var(--soft);margin-right:6px}
.choice.sel{border-color:var(--blue);background:var(--blue-l)}
.choice.right{border-color:var(--green);background:var(--green-l)}
.choice.wrong{border-color:var(--red);background:var(--red-l)}
.note{font-size:15px;color:var(--soft);margin-top:8px;min-height:22px;font-weight:700}
.bigidea{background:var(--purple-l);border-color:#D8CCFB}
.bigidea p{margin:0;font-size:18px;font-weight:700}

.play{border-color:#BFD7FB;background:#F7FBFF}
.stage{width:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:800;box-shadow:0 3px 0 #1D4ED8}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1D4ED8}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.o{background:var(--orange);box-shadow:0 3px 0 #B45309}
.btn.g{background:var(--green);box-shadow:0 3px 0 #166534}
.btn.p{background:var(--purple);box-shadow:0 3px 0 #6D28D9}
.btn:disabled{opacity:.4;cursor:default}
.readout{font-weight:900;font-size:20px;background:#fff;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;display:inline-block}
.readout.ok{border-color:var(--green);background:var(--green-l);border-style:solid}
.readout.bad{border-color:var(--red);background:var(--red-l);border-style:solid}
.slider{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
.slider input[type=range]{width:220px;accent-color:var(--blue);height:28px}
.hint{font-size:15px;color:var(--soft);font-weight:700;margin-top:6px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

.steps{counter-reset:s}
.step{border-left:5px solid var(--line);padding:4px 0 10px 14px;margin-left:6px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:-17px;top:2px;width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--ink);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.step.on{border-color:var(--blue)}
.step.on::before{background:var(--blue);color:#fff}
.step.done{border-color:var(--green)}
.step.done::before{background:var(--green);color:#fff;content:"✓"}
.step p{margin:2px 0 6px;font-size:18px}
.ask{background:var(--orange-l);border-radius:12px;padding:8px 10px;margin-top:4px}
.ask .aq{font-weight:800;font-size:16px}
.ask .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ask .opt{background:#fff;border:2px solid #F3D9A4;border-radius:10px;padding:4px 12px;font-weight:800}
.ask .opt.right{background:var(--green-l);border-color:var(--green)}
.ask .opt.wrong{background:var(--red-l);border-color:var(--red);animation:shake .3s}
.ask .fb{font-size:15px;font-weight:700;margin-top:4px;min-height:20px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.locked{opacity:.45;filter:grayscale(.6);pointer-events:none}
.trap{background:var(--red-l);border-color:#FBC5CF}
.trap p{margin:0;font-weight:700}
.finale{background:var(--green-l);border-color:#A7E8BC;text-align:center}
.finale .ans{font-size:28px;font-weight:900;margin:4px 0}
.hidden{display:none !important}
.fade-in{animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
svg text{font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800}
.tap{cursor:pointer}
.tap:hover{filter:brightness(1.07)}
footer{color:var(--soft);font-size:13px;text-align:center;padding:24px 16px 40px}
@media (max-width:600px){
  .wrap{padding:10px}
  .card{padding:12px}
  header.top .logo .full{display:none}
  .readout{font-size:17px}
  html,body{font-size:17px}
  .hero h1{font-size:25px}
  .ptitle h2{font-size:20px}
  .q{font-size:17px}
  .slider input[type=range]{width:160px}
  .grid{grid-template-columns:repeat(2,1fr)}
}

/* ===== game layer ===== */
.hud{display:flex;align-items:center;gap:8px;background:var(--orange-l);border-radius:999px;padding:4px 12px 4px 6px;font-weight:900;white-space:nowrap;cursor:pointer}
.hud .pet{font-size:24px;line-height:1}
.hud .lv{font-size:15px}
.xpbar{display:inline-block;width:90px;height:10px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid #F3D9A4}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#F59E0B,#EC4899);border-radius:999px;transition:width .6s}
.xpbar.big{width:100%;height:16px;margin:6px 0}
.hud .st{font-size:14px}
.xpfloat{position:absolute;transform:translateX(-50%);background:#16A34A;color:#fff;font-weight:900;font-size:15px;padding:3px 10px;border-radius:999px;pointer-events:none;z-index:60;animation:xpup 1.3s ease-out forwards;white-space:nowrap}
@keyframes xpup{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;width:max-content;max-width:92vw}
.toast{background:#2B2340;color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:fin .3s ease}
.toast.out{opacity:0;transition:opacity .4s}
.modal-bg{position:fixed;inset:0;background:rgba(43,35,64,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:22px;padding:22px;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .35s ease}
.modal h2{margin:4px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.bigpet{font-size:64px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.player{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#FFF7E6,#FDF2F8)}
.player .pinfo{flex:1;min-width:0}
.pname{font-weight:900;font-size:20px}
.psub{font-size:14px;color:var(--soft);font-weight:700}
.pstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pstats span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:800}
.review{border-color:#D8CCFB;background:#FAF7FF}
.tstars{margin-top:auto;padding-top:4px;color:var(--orange);font-size:17px;letter-spacing:1px}
.tile.done::after{content:none}
.tile.gold{border-color:var(--gold);background:linear-gradient(135deg,#FEF9C3,#FEF3C7)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.badge{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px;text-align:center;opacity:.7}
.badge.got{border:3px solid var(--gold);opacity:1;background:#FFFBEB}
.badge .bi{font-size:30px}
.badge .bn{font-weight:900;font-size:14px}
.badge .bd{font-size:12px;color:var(--soft);font-weight:700}
.science summary{cursor:pointer;font-weight:900}
.science li{margin:6px 0;font-size:15px}
.twin{border-color:#FBCFE8;background:#FFF5FA}
.twin .fb{font-weight:700;margin-top:8px}
.bigstars{font-size:34px;color:var(--orange);letter-spacing:4px}
.soft{color:var(--soft);font-weight:700;font-size:15px}
@media (max-width:600px){ .xpbar{width:50px} .hud .st{display:none} .player{flex-direction:column;text-align:center} .bigpet{font-size:54px} }

</style>
</head>
<body>
<header class="top">
  <button class="logo" onclick="location.hash='#/'"><span class="badge">AMC&nbsp;8</span><span>2026<span class="full"> · Learn by Playing</span></span></button>
  <span class="sp"></span>
  <span class="hud" id="hud" onclick="location.hash='#/'"></span>
</header>
<main class="wrap" id="app"></main>
<footer>Problems are re-told in kid-friendly words; the official problems are © Mathematical Association of America (MAA).<br>Explanations co-written by Claude and ChatGPT Work. Made for curious young mathematicians.</footer>
<script>
/* ===== tiny helpers ===== */
const NS = 'http://www.w3.org/2000/svg';
const W = {};          // widgets by problem number
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function S(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs){ for (const k in attrs){ if (k==='text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); } return e; }
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function tween(dur, fn){
  return new Promise(res=>{
    const t0 = performance.now();
    function f(now){
      const t = Math.min(1,(now-t0)/dur);
      fn(ease(t), t);
      if (t<1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const lerp = (a,b,t)=>a+(b-a)*t;
function gcd(a,b){ return b?gcd(b,a%b):Math.abs(a); }
function frac(n,d){ const g=gcd(n,d); return (n/g)+'/'+(d/g); }

/* ===== widget toolkit (passed to every widget) ===== */
function makeKit(box){
  const kit = {
    svg(w, hgt, maxw){
      const s = S('svg', {viewBox:`0 0 ${w} ${hgt}`, class:'stage'});
      if (maxw) s.style.maxWidth = maxw+'px', s.style.margin = '0 auto';
      box.appendChild(s); return s;
    },
    row(){ const r = h('div',{class:'ctrls'}); box.appendChild(r); return r; },
    btn(row, label, fn, cls){ const b = h('button',{class:'btn '+(cls||''), onclick:fn}, label); row.appendChild(b); return b; },
    readout(row, txt){ const r = h('span',{class:'readout'}, txt||''); row.appendChild(r); return r; },
    slider(row, label, min, max, step, val, fn){
      const out = h('span',{class:'mono'}, String(val));
      const inp = h('input',{type:'range', min, max, step, value:val});
      inp.addEventListener('input', ()=>{ out.textContent = inp.value; fn(+inp.value); });
      const wrap = h('label',{class:'slider'}, label, inp, out);
      row.appendChild(wrap);
      return { input: inp, set(v){ inp.value = v; out.textContent = v; fn(+v); }, get value(){ return +inp.value; } };
    },
    hint(txt){ const d = h('div',{class:'hint', html:txt}); box.appendChild(d); return d; },
    say(el, txt, state){ el.innerHTML = txt; el.classList.toggle('ok', state==='ok'); el.classList.toggle('bad', state==='bad'); }
  };
  return kit;
}

/* ===== confetti ===== */
function confetti(){
  const c = h('canvas',{class:'confetti'}); document.body.appendChild(c);
  const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#3B82F6','#F59E0B','#16A34A','#EC4899','#8B5CF6','#EAB308'];
  const ps = Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let f = 0;
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.45; p.a+=0.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(loop); else c.remove();
  })();
}


/* ===== Game layer: XP, levels, pet, stars, badges, combos, spaced review =====
   Design rules (learning science):
   - reward LEARNING actions (first-try retrieval, fixing mistakes, transfer), never time spent
   - praise effort & strategy, not "being smart"
   - spaced "memory checks" on later days; no punishing streaks; gentle brain breaks          */
const GAME_KEY = 'amc8-2026-game-v1';
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const LEVELS = [
  [0,'🥚','Number Egg'], [80,'🐣','Curious Hatchling'], [200,'🐥','Pattern Chick'], [360,'🐤','Picture Thinker'],
  [560,'🐦','Clever Songbird'], [800,'🦉','Puzzle Owl'], [1080,'🦉','Wise Owl'], [1400,'🦅','Math Falcon'],
  [1800,'🦅','AMC Eagle'], [2400,'🐉','Legend Dragon']
];
const BADGES = [
  ['first_step','👣','First Step','Answer your first step'],
  ['solver','🧩','Problem Solver','Solve any problem'],
  ['warm','🌅','Warm-up Champ','Solve problems 1–8'],
  ['think','🧠','Deep Thinker','Solve problems 9–16'],
  ['hero','🦸','Challenge Hero','Solve problems 17–25'],
  ['boss','⚔️','Twin Tamer','Beat a Twin Challenge'],
  ['triple','🌟','Triple Star','Get ★★★ on a problem'],
  ['comeback','💪','Comeback Kid','Fix 5 mistakes'],
  ['instinct','🎯','Sharp Instinct','Guess right on 5 problems'],
  ['explorer','🔭','Explorer','Play with pictures 100 times'],
  ['memory','🔁','Memory Keeper','Pass a memory check on a later day'],
  ['fire','🔥','On Fire','10 first-try answers in a row'],
  ['regular','📅','Regular','Practise on 3 different days'],
  ['master','🏆','Grand Master','★★★ on all 25 problems']
];
const PRAISE_RIGHT = ['Nice!','Smart thinking!','Yes!','Spot on!','Great!'];
const PRAISE_FIX = ['You fixed it! 💪','Never give up! 💪','Brain grew! 💪'];
const ENCOURAGE = ['Not yet — try again!','Peek at the picture 👀','Close! Try again.'];
const pick = a => a[Math.random()*a.length|0];
const INTERVALS = [1, 3, 7, 14, 30];   // expanding review gaps in days (Leitner-style spaced retrieval)
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

const G = (() => {
  let s;
  try { s = JSON.parse(localStorage.getItem(GAME_KEY) || 'null'); } catch(e){ s = null; }
  s = Object.assign({xp:0, stars:{}, solvedAt:{}, twinAt:{}, twinFirst:{}, reviews:{}, badges:[], days:[], fixes:0, instincts:[], interactions:0, bestCombo:0}, s||{});
  // migrate old single-star progress
  try { (JSON.parse(localStorage.getItem('amc8-2026-stars-v1')||'[]')).forEach(n=>{ if(!s.stars[n]) s.stars[n]=1; }); } catch(e){}
  let combo = 0, solvedSession = 0;
  const save = () => { try { localStorage.setItem(GAME_KEY, JSON.stringify(s)); } catch(e){} };
  if (!s.days.includes(today())) { s.days.push(today()); save(); }

  function level(xp = s.xp){ let i = 0; while (i+1 < LEVELS.length && xp >= LEVELS[i+1][0]) i++; return i; }
  function hud(){
    const el = document.getElementById('hud'); if (!el) return;
    const L = level(), cur = LEVELS[L][0], nxt = LEVELS[L+1] ? LEVELS[L+1][0] : cur;
    const pct = LEVELS[L+1] ? Math.round((s.xp-cur)/(nxt-cur)*100) : 100;
    const stars = Object.values(s.stars).reduce((a,b)=>a+b,0);
    el.innerHTML = `<span class="pet">${LEVELS[L][1]}</span><span class="lv">Lv ${L+1}</span><span class="xpbar"><i style="width:${pct}%"></i></span><span class="st">★ ${stars}/75</span>`;
  }
  function floatXP(amount, anchor, label){
    const r = anchor ? anchor.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0};
    const f = h('div',{class:'xpfloat'}, `+${amount} XP` + (label?` · ${label}`:''));
    f.style.left = (r.left + r.width/2) + 'px'; f.style.top = (r.top + scrollY - 6) + 'px';
    document.body.appendChild(f); setTimeout(()=>f.remove(), 1300);
  }
  function toast(html, ms=2600){
    let t = document.getElementById('toasts'); if (!t){ t = h('div',{id:'toasts'}); document.body.appendChild(t); }
    const el = h('div',{class:'toast', html}); t.appendChild(el);
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 400); }, ms);
  }
  function modal(inner, btns){
    const bg = h('div',{class:'modal-bg'});
    const m = h('div',{class:'modal'}, inner);
    const row = h('div',{class:'ctrls', style:'justify-content:center'});
    (btns||[['Yay!','g',()=>{}]]).forEach(([label,cls,fn])=>row.append(h('button',{class:'btn '+cls, onclick:()=>{ bg.remove(); fn(); }}, label)));
    m.append(row); bg.append(m); document.body.appendChild(bg);
  }
  function award(n, anchor, label){
    const before = level();
    s.xp += n; save(); floatXP(n, anchor, label); hud();
    const after = level();
    if (after > before){
      setTimeout(()=>{ confetti(); modal(h('div',{}, h('div',{class:'bigpet'}, LEVELS[after][1]), h('h2',{}, `Level ${after+1}!`), h('p',{}, `You're a `, h('b',{}, LEVELS[after][2]), '!'))); }, 500);
    }
  }
  function badge(id){
    if (s.badges.includes(id)) return;
    s.badges.push(id); save();
    const b = BADGES.find(x=>x[0]===id);
    setTimeout(()=>toast(`<span style="font-size:22px">${b[1]}</span> <b>New badge:</b> ${b[2]}`), 700);
  }
  function solvedRange(lo,hi){ for (let i=lo;i<=hi;i++) if (!s.stars[i]) return false; return true; }

  return {
    state: s, level, hud, toast, modal, award,
    pick, PRAISE_RIGHT, PRAISE_FIX, ENCOURAGE,
    starsOf: n => s.stars[n] || 0,
    reviewDue: n => {
      if (!s.stars[n] || !s.solvedAt[n]) return false;
      const last = s.twinAt[n] && s.twinAt[n] > s.solvedAt[n] ? s.twinAt[n] : s.solvedAt[n];
      return daysBetween(last, today()) >= INTERVALS[Math.min(s.reviews[n]||0, INTERVALS.length-1)];
    },
    nextReviewIn: n => INTERVALS[Math.min(s.reviews[n]||0, INTERVALS.length-1)],
    interact(){ s.interactions++; if (s.interactions % 10 === 0) save(); if (s.interactions >= 100) badge('explorer'); },
    stepAnswer(correct, firstTry, anchor){
      if (!correct){ combo = 0; return; }
      badge('first_step');
      if (firstTry){
        combo++; s.bestCombo = Math.max(s.bestCombo, combo);
        award(10, anchor);
        if (combo===3 || combo===5 || combo===10 || (combo>10 && combo%5===0)) toast(`🔥 <b>${combo} in a row!</b>`);
        if (combo >= 10) badge('fire');
      } else {
        combo = 0; s.fixes++; save();
        award(5, anchor, '💪');
        if (s.fixes >= 5) badge('comeback');
      }
    },
    solve(n, guessRight, wrongs, anchor){
      const first = !s.stars[n];
      const newStars = Math.max(s.stars[n]||0, wrongs<=1 ? 2 : 1);
      s.stars[n] = newStars;
      if (first) s.solvedAt[n] = today();
      save();
      if (first){
        award(20, anchor, '🧩');
        if (guessRight){ if (!s.instincts.includes(n)) s.instincts.push(n); save(); setTimeout(()=>award(10, anchor, '🎯'), 600); if (s.instincts.length>=5) badge('instinct'); }
      }
      badge('solver');
      if (solvedRange(1,8)) badge('warm');
      if (solvedRange(9,16)) badge('think');
      if (solvedRange(17,25)) badge('hero');
      if (s.days.length >= 3) badge('regular');
      hud();
      solvedSession++;
      if (solvedSession % 4 === 0){
        setTimeout(()=>modal(h('div',{}, h('div',{class:'bigpet'},'🧃'), h('h2',{}, 'Brain break?'),
          h('p',{}, `${solvedSession} solved! Stretch and drink water — it helps you remember.`)),
          [['Break','alt',()=>{}],['Keep going','g',()=>{}]]), 2600);
      }
      return newStars;
    },
    twin(n, firstTry, anchor, isReview){
      const wasReview = isReview && s.twinAt[n] !== today();
      if (firstTry){ s.stars[n] = 3; s.twinFirst[n] = true; }
      if (wasReview) s.reviews[n] = firstTry ? (s.reviews[n]||0) + 1 : 0;   // pass: longer gap; miss: back to 1 day
      s.twinAt[n] = today(); save();
      award(firstTry ? 30 : 15, anchor, wasReview ? '🔁' : '⚔️');
      badge('boss');
      if (firstTry) badge('triple');
      if (wasReview && firstTry) badge('memory');
      if ([...Array(25)].every((_,i)=>s.stars[i+1]===3)) badge('master');
      hud();
    },
    BADGES, LEVELS
  };
})();

  const groups = [];
  for (let gI=0; gI<4; gI++){
    const x = 4 + gI*177;
    const g = S('g',{opacity:0, class:'tap'},svg);
    S('path',{d:`M${x+4},132 v10 h${169} v-10`,fill:'none',stroke:'#8B5CF6','stroke-width':3},g);
    const bub = S('rect',{x:x+58,y:150,width:64,height:36,rx:18,fill:'#EDE9FE',stroke:'#8B5CF6','stroke-width':2},g);
    const t = S('text',{x:x+90,y:174,'text-anchor':'middle','font-size':18,fill:'#6D28D9',text:'tap'},g);
    const val = 3*gI;  // (3g+1)+(3g+2)-(3g+3) = 3g
    g.addEventListener('click',()=>{ if (+g.getAttribute('opacity')<1) return; t.textContent = '= '+val; setA(bub,{fill:'#DCFCE7',stroke:'#16A34A'}); g.dataset.open=1; upd(); });
    groups.push(g);
  }
  const r = k.row();
  const showB = k.btn(r,'✂️ Cut into groups of 3', ()=>showGroups());
  const out = k.readout(r,'Total so far: ?');

  function showGroups(){ groups.forEach((g,i)=>setTimeout(()=>g.setAttribute('opacity',1), i*200)); showB.disabled = true; }

  centers.forEach(c=>{ const [x,y]=P(...c); S('circle',{cx:x,cy:y,r:R*U,fill:'#FDE68A',stroke:'#D97706','stroke-width':3},svg); S('circle',{cx:x,cy:y,r:3,fill:'#92400E'},svg); });
  // hull in order (y-up, counterclockwise): BL(0,0) -> BR(8,0) -> TR(6,2s3) -> TL(2,2s3)
  const hull = [[0,0],[8,0],[6,2*s3],[2,2*s3]];
  const normalsDeg = [270, 30, 90, 150]; // outward normal of edge i (from hull[i] to hull[i+1])
  const rad = d=>d*Math.PI/180;
  const ptOn = (c,deg)=>{ const [x,y]=P(c[0]+R*Math.cos(rad(deg)), c[1]+R*Math.sin(rad(deg))); return [x,y]; };
  const straights = [], arcs = [];
  const cols = ['#3B82F6','#16A34A','#EC4899','#8B5CF6'];
  hull.forEach((c,i)=>{
    const c2 = hull[(i+1)%4], nd = normalsDeg[i];
    const a = ptOn(c,nd), b = ptOn(c2,nd);
    const len = Math.hypot(c2[0]-c[0], c2[1]-c[1]);
    const line = S('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#2B2340','stroke-width':5,'stroke-linecap':'round'},svg);
    const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2, n = rad(nd);
    const lab = S('text',{x:mx+Math.cos(n)*22,y:my-Math.sin(n)*22+6,'text-anchor':'middle','font-size':17,fill:'#E11D48',opacity:0,text:Math.round(len)+' cm'},svg);
    const cl = S('line',{x1:P(...c)[0],y1:P(...c)[1],x2:P(...c2)[0],y2:P(...c2)[1],stroke:'#E11D48','stroke-width':2,'stroke-dasharray':'6 5',opacity:0},svg);
    straights.push({line,lab,cl});
  });
  // arc at hull[i] goes from normal of edge i-1 to normal of edge i (counterclockwise in y-up)
  hull.forEach((c,i)=>{
    const from = normalsDeg[(i+3)%4], to0 = normalsDeg[i];
    const to = to0 < from ? to0+360 : to0;
    const a = ptOn(c,from), b = ptOn(c,to);
    const big = (to-from) > 180 ? 1 : 0;
    // y-up counterclockwise == svg clockwise? In svg (y down) increasing math angle appears counterclockwise -> sweep 0
    const g = S('g',{},svg);
    const path = S('path',{d:`M${a[0]},${a[1]} A${R*U},${R*U} 0 ${big} 0 ${b[0]},${b[1]}`,fill:'none',stroke:'#2B2340','stroke-width':5,'stroke-linecap':'round'},g);
    const lab = S('text',{'font-size':14,fill:cols[i],opacity:0,'text-anchor':'middle',text:(to-from)+'°'},g);
    const mid = rad((from+to)/2), [lx,ly] = P(c[0]+(R+0.75)*Math.cos(mid), c[1]+(R+0.75)*Math.sin(mid));
    setA(lab,{x:lx,y:ly+5});
    arcs.push({g,path,lab,c,deg:to-from});
  });
  const target = P(12.3, s3);  // where the full circle gets assembled
  const ghost = S('circle',{cx:target[0],cy:target[1],r:R*U,fill:'none',stroke:'#CBD5E1','stroke-width':2,'stroke-dasharray':'5 5',opacity:0},svg);
  const ghostT = S('text',{x:target[0],y:target[1]+6,'text-anchor':'middle','font-size':14,fill:'#6B6385',opacity:0,text:'1 whole coin!'},svg);
  const r = k.row();
  k.btn(r,'📏 Straight parts', ()=>showStraight(),'');
  k.btn(r,'🌀 Curved parts', ()=>showCurves(),'o');
  k.btn(r,'🧲 Slide curves together', ()=>collect(),'p');
  const out = k.readout(k.row(),'');
  let sDone=false, cDone=false;
  function showStraight(){ straights.forEach(s=>{ setA(s.line,{stroke:'#E11D48'}); s.lab.setAttribute('opacity',1); s.cl.setAttribute('opacity',1); }); sDone=true; upd(); }
  function showCurves(){ arcs.forEach((a,i)=>{ setA(a.path,{stroke:cols[i]}); a.lab.setAttribute('opacity',1); }); cDone=true; upd(); }
  async function collect(){
    showCurves(); ghost.setAttribute('opacity',1);
    await tween(1400, t=>{ arcs.forEach(a=>{ const [cx,cy]=P(...a.c); a.g.setAttribute('transform',`translate(${(target[0]-cx)*t},${(target[1]-cy)*t})`); }); });
    ghostT.setAttribute('opacity',1);
    k.say(out,'4 curves = 1 whole coin: 4π','ok');
  }
  function upd(){
    k.say(out, (sDone?'Straight: 8 + 4 + 4 + 4 = 20 cm. ':'') + (cDone?'Curves turn 120°, 60°, 60°, 120°.':''), null);
  }
  k.say(out,'Tap the buttons.');
  return { step(i){ if(i===0||i===1) showStraight(); if(i===3) collect(); } };
};

/* ---------- Problem 25: hexagons from corner cuts ---------- */

  for (let i=1;i<L;i++){
    seg(along(A,C,i), along(B,C,i));   // parallel to AB
    seg(along(A,B,i), along(A,C,i));   // parallel to BC
    seg(along(B,A,i), along(B,C,i));   // parallel to CA
  }
  S('polygon',{points:[A,B,C].map(p=>p.join(',')).join(' '),fill:'none',stroke:'#2B2340','stroke-width':3},svg);

  k.slider(r,'cut C', 1, 5, 1, 2, v=>{c=v;draw();});

  const out = k.readout(r2,'');

      S('polygon',{points:[P,along(P,Q,t),along(P,R2,t)].map(p=>p.join(',')).join(' '),fill:'#FFE4E6',stroke:'#E11D48','stroke-width':2},cutsG);
    });

    if (ok){
      setA(hex,{points:pts.map(p=>p.join(',')).join(' '),opacity:1});
      const cen = [(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];
      pts.forEach((p,i)=>{ const q = pts[(i+1)%6]; const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2; const dx=mx-cen[0], dy=my-cen[1], d=Math.hypot(dx,dy)||1;
        S('text',{x:mx-dx/d*16,y:my-dy/d*16+6,'text-anchor':'middle','font-size':16,fill:'#166534',text:sides[i]},labs); });
    } else setA(hex,{opacity:0});

  const edges = new Map(), nodeCircles = {}, labels = {}, labelBGs = {};
  let chosen = "T", busy = false, trials = 0, wins = 0, demoVersion = 0;

  S("text",{x:360,y:485,"text-anchor":"middle","font-size":20,fill:C.soft,text:"Tap any dot to see its neighbours"},svg);
  ids.forEach(a=>adj[a].forEach(b=>{
    const key = edgeKey(a,b); if (edges.has(key)) return;
    edges.set(key, S("line",{x1:nodes[a].x,y1:nodes[a].y,x2:nodes[b].x,y2:nodes[b].y,stroke:"#C4B5FD","stroke-width":5,"stroke-linecap":"round"},svg));
  }));
  const particleLayer = S("g",{"pointer-events":"none"},svg);
  ids.forEach(id=>{
    const p = nodes[id];
    const g = S("g",{role:"button",tabindex:0,"aria-label":`${outer.has(id)?"Outer":"Inner"} point ${id}; show neighbours`,onclick:()=>select(id),onkeydown:e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(id); } }},svg);
    g.style.cursor = "pointer"; g.style.touchAction = "manipulation";
    nodeCircles[id] = S("circle",{cx:p.x,cy:p.y,r:17,fill:outer.has(id)?"#FEF3C7":"#EDE9FE",stroke:outer.has(id)?C.orange:C.purple,"stroke-width":3},g);
    S("circle",{cx:p.x,cy:p.y,r:25,fill:"transparent"},g);
    const dx = p.x-cx, dy = p.y-cy, dist = Math.hypot(dx,dy), ld = outer.has(id)?31:35;
    const lx = p.x + dx/dist*ld, ly = p.y + dy/dist*ld;
    labelBGs[id] = S("rect",{x:lx-27,y:ly-12,width:54,height:25,rx:7,fill:"white",opacity:0,"pointer-events":"none"},svg);
    labels[id] = S("text",{x:lx,y:ly+6,"text-anchor":"middle","font-size":17,"font-weight":800,fill:C.ink,"pointer-events":"none",text:""},svg);
  });
  const spider = S("g",{"pointer-events":"none"},svg);
  S("circle",{cx:0,cy:0,r:16,fill:"white",stroke:C.ink,"stroke-width":2},spider);
  S("text",{x:0,y:8,"text-anchor":"middle","font-size":24,text:"🕷"},spider);

  const controls = k.row();
  const walkBtn = k.btn(controls,"Walk: 3 moves",walk,"");
  const runBtn = k.btn(controls,"Run 1000 walks",run1000,"p");
  const resetBtn = k.btn(controls,"Reset count",()=>{ if(busy) return; trials=wins=0; updateCount(); },"alt");
  [walkBtn,runBtn,resetBtn].forEach(b=>{ b.style.minHeight="48px"; b.style.touchAction="manipulation"; });
  const countRow = k.row();
  const count = k.readout(countRow,"0 / 0");
  const result = k.readout(countRow,"");
  const demoRow = k.row();
  const demo = k.readout(demoRow,"");
  const replayBtn = k.btn(demoRow,"Split chances",()=>{ if(!busy) showSplit(currentStage); },"g");
  replayBtn.style.minHeight = "48px";
  let currentStage = 1;

  function placeSpider(p){ setA(spider,{transform:`translate(${p.x},${p.y})`}); }
  function setBusy(v){ busy = v; walkBtn.disabled = runBtn.disabled = resetBtn.disabled = replayBtn.disabled = v; }
  function updateCount(){ count.textContent = trials ? `${wins} / ${trials} = ${frac(wins,trials)} · ${(100*wins/trials).toFixed(1)}%` : "0 / 0"; }
  function clearHighlights(){
    edges.forEach(e=>setA(e,{stroke:"#C4B5FD","stroke-width":5}));
    ids.forEach(id=>setA(nodeCircles[id],{"stroke-width":3,stroke:outer.has(id)?C.orange:C.purple}));
  }
  function select(id){
    if (busy) return;
    chosen = id; clearHighlights();
    adj[id].forEach(n=>setA(edges.get(edgeKey(id,n)),{stroke:C.blue,"stroke-width":8}));
    setA(nodeCircles[id],{stroke:C.blue,"stroke-width":5});
    const oc = adj[id].filter(n=>outer.has(n)).length;
    k.say(demo,`${adj[id].length} neighbours · ${oc} outer`);
  }
  function nextRandom(id){ const o = adj[id]; return o[Math.floor(Math.random()*o.length)]; }
  function stopDemo(){ demoVersion++; particleLayer.replaceChildren(); }
  async function walk(){
    if (busy) return;
    setBusy(true); stopDemo(); clearHighlights(); k.say(result,"");
    let at = "T"; placeSpider(nodes[at]);
    try {
      for (let move=1; move<=3; move++){
        const next = nextRandom(at), a = nodes[at], b = nodes[next];
        setA(edges.get(edgeKey(at,next)),{stroke:C.blue,"stroke-width":8});
        k.say(result,`Move ${move} / 3`);
        await tween(420, t=>placeSpider({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)}));
        at = next; await sleep(90);
      }
      trials++; if (outer.has(at)) wins++;
      updateCount();
      k.say(result, outer.has(at) ? "Outer tip ✓" : "Inner dot", outer.has(at) ? "ok" : undefined);
    } finally { setBusy(false); }
  }
  async function run1000(){
    if (busy) return;
    setBusy(true); stopDemo(); clearHighlights();
    try {
      for (let done=0; done<1000; done+=25){
        let last = "T";
        for (let j=0;j<25;j++){
          let at = "T";
          for (let m=0;m<3;m++) at = nextRandom(at);
          trials++; if (outer.has(at)) wins++;
          last = at;
        }
        placeSpider(nodes[last]); updateCount();
        k.say(result,`${done+25} / 1000 walks`);
        await sleep(20);
      }
      k.say(result,"Compare with 1/4 = 25%","ok");
    } finally { setBusy(false); }
  }
  // Integer weights avoid rounding: every move multiplies the common denominator by 4.
  function distribution(stage){
    let weights = Object.fromEntries(ids.map(id=>[id, id==="T"?1:0]));
    let denominator = 1;
    for (let m=0; m<stage; m++){
      const next = Object.fromEntries(ids.map(id=>[id,0]));
      ids.forEach(id=>{ const share = weights[id]*(4/adj[id].length); adj[id].forEach(nb=>{ next[nb] += share; }); });
      weights = next; denominator *= 4;
    }
    return {weights, denominator};
  }
  function paintProbability(stage){
    const {weights, denominator} = distribution(stage);
    ids.forEach(id=>{ labels[id].textContent = weights[id] ? frac(weights[id],denominator) : ""; setA(labelBGs[id],{opacity: weights[id] ? 0.95 : 0}); });
    const ow = [...outer].reduce((s,id)=>s+weights[id],0);
    k.say(demo,`After ${stage} ${stage===1?"move":"moves"} · Outer: ${ow ? frac(ow,denominator) : "0"}`);
  }
  async function showSplit(stage){
    const token = ++demoVersion;
    particleLayer.replaceChildren(); clearHighlights();
    paintProbability(stage-1);
    const before = distribution(stage-1), particles = [];
    ids.forEach(id=>{
      if (!before.weights[id]) return;
      adj[id].forEach(next=>{
        setA(edges.get(edgeKey(id,next)),{stroke:C.blue,"stroke-width":6});
        const dot = S("circle",{cx:nodes[id].x,cy:nodes[id].y,r:7,fill:outer.has(next)?C.orange:C.purple,stroke:"white","stroke-width":2},particleLayer);
        particles.push({dot, a:nodes[id], b:nodes[next]});
      });
    });
    await tween(700, t=>{ if (token!==demoVersion) return; particles.forEach(({dot,a,b})=>setA(dot,{cx:lerp(a.x,b.x,t), cy:lerp(a.y,b.y,t)})); });
    if (token!==demoVersion) return;
    particleLayer.replaceChildren();
    paintProbability(stage);
  }
  placeSpider(nodes.T);
  select(chosen);
  return {
    step(i){
      // steps: first move; four neighbours; second move; third move; final 1/4
      currentStage = i<=0 ? 1 : i<=2 ? 2 : 3;
      if (busy){ stopDemo(); paintProbability(currentStage); } else showSplit(currentStage);
    }
  };
};

/* ===== pages ===== */
const app = () => document.getElementById('app');
const LET = ['A','B','C','D','E'];
const starStr = k => '★'.repeat(k) + '☆'.repeat(3-k);

function renderHome(){
  const a = app(); a.innerHTML = '';
  const s = G.state, L = G.level(), LV = G.LEVELS;
  const cur = LV[L][0], nxt = LV[L+1] ? LV[L+1][0] : cur;
  const pct = LV[L+1] ? Math.round((s.xp-cur)/(nxt-cur)*100) : 100;
  const solved = Object.keys(s.stars).length;
  const stars = Object.values(s.stars).reduce((x,y)=>x+y,0);

  a.append(h('div',{class:'hero'},
    h('h1',{}, 'AMC 8 · 2026 — Learn by Playing'),
    h('p',{}, 'Guess → Play → Climb → Win ★★★')));

  // player card
  a.append(h('div',{class:'card player'},
    h('div',{class:'bigpet'}, LV[L][1]),
    h('div',{class:'pinfo'},
      h('div',{class:'pname'}, `Level ${L+1} · ${LV[L][2]}`),
      h('div',{class:'xpbar big'}, h('i',{style:`width:${pct}%`})),
      h('div',{class:'psub'}, LV[L+1] ? `${s.xp} XP · ${nxt - s.xp} more to grow ${LV[L+1][1]}` : `${s.xp} XP · fully grown!`),
      h('div',{class:'pstats'},
        h('span',{}, `🧩 ${solved}/25`), h('span',{}, `★ ${stars}/75`), h('span',{}, `📅 ${s.days.length} day${s.days.length>1?'s':''}`), h('span',{}, `🏅 ${s.badges.length}/${G.BADGES.length}`)))));

  // how stars work
  a.append(h('div',{class:'how'},
    h('div',{}, '★ finish'), h('div',{}, '★★ 0–1 slips'), h('div',{}, '★★★ beat the Twin')));

  // review queue (spaced practice)
  const due = PROBS.filter(p=>G.reviewDue(p.n));
  if (due.length){
    const row = h('div',{class:'ctrls'});
    due.slice(0,8).forEach(p=>row.append(h('button',{class:'btn p', onclick:()=>location.hash='#/p/'+p.n}, `🔁 ${p.n}. ${p.title}`)));
    a.append(h('div',{class:'card review'}, h('h3',{}, '🔁 Still remember? ', h('span',{class:'chip'}, '+30 XP each')), row));
  }

  const bands = [[1,8,'Warm-up (1–8)'],[9,16,'Thinking (9–16)'],[17,25,'Challenge (17–25)']];
  for (const [lo,hi,name] of bands){
    a.append(h('div',{class:'band'}, name));
    const g = h('div',{class:'grid'});
    for (let n=lo;n<=hi;n++){
      const p = PROBS[n-1], k = G.starsOf(n);
      g.append(h('button',{class:'tile'+(k?' done':'')+(k===3?' gold':''), onclick:()=>{ location.hash = '#/p/'+n; }},
        h('div',{class:'num'}, String(n)), h('div',{class:'ico'}, p.icon),
        h('div',{class:'tt'}, p.title), h('div',{class:'tp'}, p.topic),
        h('div',{class:'tstars'}, (G.reviewDue(n)?'🔁 ':'') + starStr(k))));
    }
    a.append(g);
  }

  // trophy shelf
  const shelf = h('div',{class:'shelf'});
  G.BADGES.forEach(([id,ic,name,desc])=>{
    const got = s.badges.includes(id);
    shelf.append(h('div',{class:'badge'+(got?' got':''), title:desc}, h('div',{class:'bi'}, got?ic:'🔒'), h('div',{class:'bn'}, name), h('div',{class:'bd'}, desc)));
  });
  a.append(h('div',{class:'band'}, 'Trophy shelf'), shelf);

  // for grown-ups
  a.append(h('details',{class:'card science'},
    h('summary',{}, '🔬 Why this works (for parents & teachers)'),
    h('ul',{html:`
      <li><b>Guess first</b> — predicting before learning primes attention, even when the guess is wrong (pretesting effect; Richland, Kornell &amp; Kao, 2009).</li>
      <li><b>Tiny steps, each with a question</b> — answering beats re-reading (retrieval practice; Roediger &amp; Karpicke, 2006), and steps act as scaffolding that fades as you climb (Wood, Bruner &amp; Ross, 1976).</li>
      <li><b>Instant, specific feedback</b> after every answer (Hattie &amp; Timperley, 2007).</li>
      <li><b>Play with the picture</b> — manipulating a visual model links the idea to something concrete (dual coding; Paivio; Mayer's multimedia principles).</li>
      <li><b>Twin Challenge</b> — same idea, new numbers, so the idea transfers instead of the answer being memorised (Gick &amp; Holyoak, 1983).</li>
      <li><b>Memory checks on later days</b> — gaps grow 1 → 3 → 7 → 14 → 30 days after each success (and reset after a miss), because spaced, expanding retrieval beats cramming (spacing effect; Cepeda et al., 2006; Landauer &amp; Bjork, 1978).</li>
      <li><b>Praise for effort and strategy</b>, never "you're smart" (Mueller &amp; Dweck, 1998). Fixing a mistake still earns XP.</li>
      <li><b>XP, levels, a growing buddy, badges</b> — visible progress feeds competence and autonomy (Ryan &amp; Deci, 2000) and pulls kids toward the next goal (goal-gradient effect; Kivetz et al., 2006). Gamification helps learning when rewards track real learning (Sailer &amp; Homner, 2020 meta-analysis).</li>
      <li><b>No loot boxes, no streak punishments, gentle brain breaks</b> — rewards are tied to mastery, not time, to avoid crowding out intrinsic interest (Deci, Koestner &amp; Ryan, 1999).</li>`})));
  G.hud();
  scrollTo(0,0);
}

function twinCard(n, isReview){
  const t = (typeof TWINS !== 'undefined') && TWINS.find(x=>x.n===n);
  if (!t) return null;
  let tries = 0, done = false;
  const fb = h('div',{class:'fb'});
  const card = h('div',{class:'card twin fade-in'},
    h('h3',{}, isReview ? '🔁 Memory check' : '⚔️ Twin Challenge', h('span',{class:'chip'}, isReview ? '+30 XP' : '1st try = ★★★')),
    h('div',{class:'q', html:t.q}));
  const opts = t.o.map((o,j)=> h('button',{class:'choice', onclick:()=>{
    if (done) return;
    tries++;
    if (j === t.a){
      done = true; opts[j].classList.add('right');
      fb.innerHTML = (tries===1 ? '🌟 First try! ' : '✓ Got it! ') + t.why;
      G.twin(n, tries===1, opts[j], isReview);
      document.querySelectorAll('.bigstars').forEach(e=>e.textContent = starStr(G.starsOf(n)));
      document.querySelectorAll('.tip3').forEach(e=>e.textContent = G.starsOf(n)===3 ? 'Perfect! ★★★' : '🔁 Try the Twin again tomorrow for ★★★');
      if (tries===1){ confetti(); fb.innerHTML += `<br><span class="soft">🔁 See you in ${G.nextReviewIn(n)} day${G.nextReviewIn(n)>1?'s':''}!</span>`; }
      else fb.innerHTML += '<br><span class="soft">🔁 Try again tomorrow for ★★★.</span>';
    } else {
      opts[j].classList.add('wrong'); opts[j].disabled = true;
      fb.innerHTML = '💡 Hint: ' + t.hint;
    }
  }}, h('span',{class:'L'}, '('+LET[j]+')'), o));
  card.append(h('div',{class:'choices'}, opts), fb);
  return card;
}

function renderProblem(n){
  const p = PROBS[n-1]; const a = app(); a.innerHTML = '';
  let guess = null, wrongs = 0;
  const solvedBefore = G.starsOf(n) > 0;
  a.append(h('div',{class:'pnav'},
    h('button',{class:'pill', onclick:()=>location.hash='#/'}, '⌂ All'),
    h('span',{class:'sp'}),
    h('button',{class:'pill', disabled: n===1?'':null, onclick:()=>location.hash='#/p/'+(n-1)}, '‹ Prev'),
    h('button',{class:'pill', disabled: n===25?'':null, onclick:()=>location.hash='#/p/'+(n+1)}, 'Next ›')));
  a.append(h('div',{class:'ptitle'}, h('span',{class:'big'}, String(n)),
    h('div',{}, h('h2',{}, p.icon+' '+p.title), h('div',{class:'topic'}, p.topic + (solvedBefore ? ' · ' + starStr(G.starsOf(n)) : '')))));

  // problem + guess
  const note = h('div',{class:'note'}, solvedBefore ? 'Solved before! Try the memory check ↓' : 'Guess first! 🎯');
  const chs = p.choices.map((c,i)=> h('button',{class:'choice', onclick:()=>{
      if (a.dataset.finished) return;
      guess = i; chs.forEach(b=>b.classList.remove('sel')); chs[i].classList.add('sel');
      note.textContent = `Locked in (${LET[i]}). Let's check ↓`;
    }}, h('span',{class:'L'}, '('+LET[i]+')'), c));
  a.append(h('div',{class:'card'}, h('h3',{}, '📜 Problem'), h('div',{class:'q', html:p.q}), h('div',{class:'choices'}, chs), note));

  // spaced review: test BEFORE re-study
  if (solvedBefore){ const tc = twinCard(n, G.reviewDue(n)); if (tc) a.append(tc); }

  a.append(h('div',{class:'card bigidea'}, h('h3',{}, '💡 Big idea'), h('p',{html:p.big})));

  const box = h('div');
  box.addEventListener('pointerdown', ()=>G.interact());
  a.append(h('div',{class:'card play'}, h('h3',{}, '🎮 Play'), box));
  let wapi = {};
  try { wapi = (W[n] ? W[n](box, makeKit(box)) : {}) || {}; } catch(e){ console.error('widget', n, e); box.append(h('div',{class:'hint'}, 'Widget failed to load.')); }

  const stepsWrap = h('div',{class:'steps'});
  a.append(h('div',{class:'card'}, h('h3',{}, '🪜 Steps ', h('span',{class:'chip'}, '+10 XP')), stepsWrap));
  const trap = h('div',{class:'card trap hidden'}, h('h3',{}, '⚠️ Trap!'), h('p',{html:p.trap}));
  const fin = h('div',{class:'card finale hidden'});
  a.append(trap, fin);

  const stepEls = p.steps.map((st,i)=>{
    const el = h('div',{class:'step'+(i?' locked':'')}, h('p',{html:st.t}));
    if (st.ask){
      const fb = h('div',{class:'fb'});
      let missed = false;
      const opts = st.ask.o.map((o,j)=> h('button',{class:'opt', onclick:()=>{
        if (el.classList.contains('done')) return;
        if (j === st.ask.a){
          opts[j].classList.add('right');
          fb.innerHTML = '✓ ' + (st.ask.yes || '') + ' <span class="soft">' + (missed ? G.pick(G.PRAISE_FIX) : G.pick(G.PRAISE_RIGHT)) + '</span>';
          G.stepAnswer(true, !missed, opts[j]);
          finishStep(i);
        } else {
          if (!missed) wrongs++;
          missed = true; G.stepAnswer(false);
          opts[j].classList.remove('wrong'); void opts[j].offsetWidth; opts[j].classList.add('wrong');
          fb.innerHTML = (st.ask.no ? st.ask.no + ' ' : '') + '<span class="soft">' + G.pick(G.ENCOURAGE) + '</span>';
        }
      }}, o));
      el.append(h('div',{class:'ask'}, h('div',{class:'aq', html:st.ask.q}), h('div',{class:'opts'}, opts), fb));
    } else {
      const b = h('button',{class:'btn alt', style:'margin-top:4px', onclick:()=>{ b.remove(); finishStep(i); }}, 'Got it → next');
      el.append(b);
    }
    stepsWrap.append(el);
    return el;
  });
  function activate(i){
    const el = stepEls[i]; el.classList.remove('locked'); el.classList.add('on','fade-in');
    if (wapi.step) { try { wapi.step(i); } catch(e){ console.error(e); } }
  }
  function finishStep(i){
    stepEls[i].classList.remove('on'); stepEls[i].classList.add('done');
    if (i+1 < stepEls.length){ activate(i+1); setTimeout(()=>stepEls[i+1].scrollIntoView({behavior:'smooth',block:'nearest'}),50); }
    else finale();
  }
  function finale(){
    a.dataset.finished = 1;
    trap.classList.remove('hidden'); trap.classList.add('fade-in');
    chs.forEach((b,i)=>{ b.classList.remove('sel'); if (i===p.ans) b.classList.add('right'); else if (i===guess) b.classList.add('wrong'); });
    const msg = guess===null ? 'You did it!' : (guess===p.ans ? 'Your guess was right! 🎯' : `You guessed (${LET[guess]}). Now you know why!`);
    const k = G.solve(n, guess===p.ans && !solvedBefore, wrongs, fin);
    fin.innerHTML = '';
    fin.append(h('h3',{style:'justify-content:center'}, '🏆 Answer'), h('div',{class:'ans'}, `(${LET[p.ans]}) ${p.choices[p.ans]}`),
      h('div',{class:'bigstars'}, starStr(k)), h('div',{}, msg),
      h('div',{class:'soft tip3', style:'margin-top:4px'}, k<3 ? 'Beat the Twin ↓ for ★★★' : 'Perfect! ★★★'));
    if (n<25) fin.append(h('div',{class:'ctrls', style:'justify-content:center'}, h('button',{class:'btn g', onclick:()=>location.hash='#/p/'+(n+1)}, `Next ›`)));
    fin.classList.remove('hidden'); fin.classList.add('fade-in');
    confetti();
    if (!solvedBefore){ const tc = twinCard(n, false); if (tc) fin.after(tc); }
    setTimeout(()=>fin.scrollIntoView({behavior:'smooth',block:'center'}),80);
  }
  activate(0);
  G.hud();
  scrollTo(0,0);
}

function route(){
  const m = location.hash.match(/^#\/p\/(\d+)/);
  const n = m ? +m[1] : 0;
  if (n>=1 && n<=25) renderProblem(n); else renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

</script>
